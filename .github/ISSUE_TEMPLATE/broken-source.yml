name: Report a broken source
description: A dataset on open-data.pt that is late, empty, or different from what its publisher shows.
title: "Broken: "
body:
  - type: input
    id: page
    attributes:
      label: Page on open-data.pt
      placeholder: https://open-data.pt/product/?slug=…
    validations:
      required: true
  - type: dropdown
    id: problem
    attributes:
      label: What is wrong
      options:
        - It stopped updating
        - It is empty
        - Values differ from the publisher's
        - Fields are missing or have the wrong type
        - Something else
    validations:
      required: true
  - type: textarea
    id: details
    attributes:
      label: Details
      description: What you expected, what you saw, and a link to the publisher's own page if you have one.
