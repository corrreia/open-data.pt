name: Checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  WRANGLER_SEND_METRICS: "false"

jobs:
  check:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Lint and format
            run: pnpm lint && pnpm format:check
          # The kernel's Pipelines bindings only generate typed with a Cloudflare login,
          # so the drift check needs a token; the typecheck against the checked-in types does not.
          - name: Types
            run: |
              if [ -n "$CLOUDFLARE_API_TOKEN" ]; then pnpm types:check; else echo "::notice::No CLOUDFLARE_API_TOKEN secret; skipping types:check"; fi
              pnpm typecheck
          - name: Tests
            run: pnpm test
          - name: Bundles
            run: pnpm deploy:dry-run
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 10.33.0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: ${{ matrix.run }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ matrix.name == 'Types' && secrets.CLOUDFLARE_API_TOKEN || '' }}
